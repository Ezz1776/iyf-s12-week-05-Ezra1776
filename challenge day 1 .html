<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Day 1: Color Changer</title></head>
<body>
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <button id="color-btn">Change Colors</button>
    <script>
        document.getElementById("color-btn").addEventListener("click", () => {
            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);
            document.querySelectorAll("h1, h2, h3").forEach(el => el.style.color = randomColor);
        });
    </script>
</body>
</html>
