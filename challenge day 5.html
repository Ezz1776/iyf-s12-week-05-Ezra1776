<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Day 5: Dark Mode Toggle</title>
    <style>
        body { background-color: #ffffff; color: #000000; transition: background 0.3s, color 0.3s; padding: 20px; }
        body.dark-mode { background-color: #121212; color: #ffffff; }
    </style>
</head>
<body>
    <h1>Dark Mode Toggle Test</h1>
    <button id="dark-toggle">Toggle Dark Mode</button>
    <script>
        document.getElementById("dark-toggle").addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
        });
    </script>
</body>
</html>
